{% extends "base.html" %}
{% block content %}
<h1>Hotels</h1>
<nav>
    {% if session.get("user_id") %}
        <span>Logged in</span>
        <form action="/logout" method="post" style="display:inline;">
            <button type="submit">Logout</button>
        </form>
    {% else %}
        <a href="/login">Login</a>
        <a href="/register">Register</a>
    {% endif %}
</nav>
<hr>

<a href="{{url_for('hotel_create')}}" class="btn btn-primary mb-3">New Hotel</a>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Location</th>
            <th>Rating</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
    {% for hotel in hotels %}
        <tr>
            <td><a  href="{{url_for('hotel_detail', hotel_id=hotel.id)}}">{{hotel.name}}</a></td>
            <td>{{hotel.location}}</td>
            <td>{{hotel.rating}}</td>
            <td class="text-end">
                <a href="{{url_for('hotel_edit', hotel_id=hotel.id)}}" class="btn btn-sm btn-warning">Edit</a>
                <form action="{{url_for('hotel_delete', hotel_id=hotel.id)}}" method="POST" class="d-inline">
                    <button class="btn btn-sm btn-danger" onclick="return confirm('Delete this hotel?')">Delete</button>
                </form>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
